<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="left">
        <video autoplay muted loop playsinline>
            <source src="/Login/assets/pin-on-hd-auto-.mp4" type="video/mp4">
        </video>
    </div>

    <div class="right">

        <h1>NOVA SENHA</h1>

        <div id="mensagem" class="mensagem"></div>

        <form id="recuperarForm">

            <div class="input-box">
                <label>E-mail</label>
                <input id="email" type="email" placeholder="Digite seu e-mail">
            </div>

            <div class="input-box">
                <label>Nova senha</label>
                <input id="senha" type="password" placeholder="Nova senha">
            </div>

            <div class="input-box">
                <label>Confirmar senha</label>
                <input id="confirmar" type="password" placeholder="Confirme a senha">
            </div>

            <button class="button">
                Alterar Senha
            </button>

        </form>

        <div class="links">
            <a href="index.html">Voltar ao Login</a>
        </div>

    </div>

</div>

<script src="esqueceuSenha.js"></script>

</body>
</html>
