<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ice Cream</title>

    <link rel="stylesheet" href="/Login/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="left">
    <video
    autoplay
    muted
    loop
    playsinline
    preload="auto"
>
    <source src="/Login/assets/pin-on-hd-auto-.mp4" type="video/mp4">
</video>
</div>

    <div class="right">

        <h1>LOGIN</h1>

        <form>

            <div class="input-box">

                <label>Email ou ID</label>

                <input
                type="text"
                placeholder="Username">

            </div>

            <div class="input-box">

                <label>Senha</label>

                <input
                type="password"
                placeholder="Password">

            </div>

            <button>Entrar</button>

        </form>

        <div class="links">

            <a href="#">Esqueceu sua senha?</a>

            <a href="#">Criar conta</a>

        </div>

        <div class="social">

            <i class="fab fa-google"></i>

            <i class="fab fa-facebook-f"></i>

            <i class="fab fa-apple"></i>

        </div>

    </div>

</div>

</body>
</html>
